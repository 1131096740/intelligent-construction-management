name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frozen dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jiangkong/api exec prisma generate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter @jiangkong/web-admin typecheck:e2e

      - name: Lint
        run: pnpm lint

      - name: Verify business error and operations safety gates
        run: |
          node services/api/scripts/check-business-errors.self-test.cjs
          pnpm --filter @jiangkong/api check:business-errors
          bash scripts/ops/go-live-safety-self-test.sh

      - name: Test
        run: pnpm test

      - name: Build production applications
        run: |
          pnpm --filter @jiangkong/api build
          pnpm --filter @jiangkong/web-admin build

      - name: Verify Web UI governance
        run: pnpm --filter @jiangkong/web-admin check:ui

      - name: Verify capability and usage manifests
        run: |
          pnpm inspect:contract-workbench-capabilities
          pnpm inspect:whole-site-capabilities
          pnpm inspect:whole-site-web-api
          pnpm inspect:whole-site-page-actions
          pnpm inspect:whole-site-route-usage
          pnpm inspect:whole-site-capability-matrix
