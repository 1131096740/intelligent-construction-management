name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frozen dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jiangkong/api exec prisma generate

      - name: Prepare PostgreSQL 16 dynamic gate image
        run: docker pull postgres:16

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter @jiangkong/web-admin typecheck:e2e

      - name: Lint
        run: pnpm lint

      - name: Verify business error and operations safety gates
        run: |
          node services/api/scripts/check-business-errors.self-test.cjs
          pnpm --filter @jiangkong/api check:business-errors
          bash scripts/ops/go-live-safety-self-test.sh

      - name: Test
        run: pnpm test

      - name: Build production applications
        run: |
          pnpm --filter @jiangkong/api build
          pnpm --filter @jiangkong/web-admin build

      - name: Verify Web UI governance
        run: pnpm --filter @jiangkong/web-admin check:ui

      - name: Run exact-SHA PostgreSQL dynamic gate
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          node services/api/prisma/run-database-dynamic-gate-local.cjs \
            --execute \
            --candidate-sha "$candidate_sha" \
            --confirm LOCAL_PG16_DYNAMIC_GATE

      - name: Verify capability and usage manifests
        run: |
          pnpm inspect:contract-workbench-capabilities
          pnpm inspect:whole-site-capabilities
          pnpm inspect:whole-site-web-api:ready
          pnpm inspect:whole-site-page-actions:ready
          pnpm inspect:whole-site-route-usage:ready
          pnpm inspect:whole-site-capability-matrix:ready
