# Temporary diagnostic branch only. This workflow is not release qualification.
name: CI roster diagnosis only
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact diagnostic branch SHA; never production"
        required: true
        type: string
env:
  CI_SOURCE_SHA: ${{ inputs.target_sha }}
  CI_REQUIRE_MAIN_ANCESTOR: "false"
permissions:
  contents: read
concurrency:
  group: diagnostic-roster-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgresql16-dynamic-gates:
    name: DIAGNOSTIC ONLY - roster trigger (${{ matrix.group }})
    runs-on: ubuntu-latest
    # POL-108 builds 20,001 facts and 100,001 impacts through the public writer.
    timeout-minutes: ${{ startsWith(matrix.group, 'operating_projection_pol108') && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        group: [employee_onboarding]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify checked-out CI source SHA
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/d5f8-roster-diagnosis
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          git merge-base --is-ancestor 40c133f5bb88c56b3d1428ef1e158c3eee698113 HEAD
          if [ "$CI_REQUIRE_MAIN_ANCESTOR" = true ]; then
            git merge-base --is-ancestor "$CI_SOURCE_SHA" origin/main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frozen dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Prefetch POL-275 reviewed-base frozen dependencies
        if: ${{ matrix.group == 'clearing_reconciliation_pol275' }}
        run: |
          set -euo pipefail
          legacy_sha="$(node -p "require('./services/api/prisma/run-pol275-clearing-reconciliation-local.cjs').REVIEWED_BASE_SHA")"
          legacy_root="$(mktemp -d "$RUNNER_TEMP/pol275-reviewed-dependencies.XXXXXX")"
          trap 'rm -rf "$legacy_root"' EXIT
          git show "$legacy_sha:pnpm-lock.yaml" > "$legacy_root/pnpm-lock.yaml"
          lock_sha="$(sha256sum "$legacy_root/pnpm-lock.yaml" | cut -d ' ' -f 1)"
          pnpm --dir "$legacy_root" fetch --ignore-scripts
          test "$(sha256sum "$legacy_root/pnpm-lock.yaml" | cut -d ' ' -f 1)" = "$lock_sha"

      - name: Prefer official HTTPS Ubuntu mirrors
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if mirrors.is_file():
              lines = mirrors.read_text().splitlines(keepends=True)
              azure = 'http://azure.archive.ubuntu.com/ubuntu/'
              official = {'https://archive.ubuntu.com/ubuntu/', 'https://security.ubuntu.com/ubuntu/'}
              urls = [line.split()[0] for line in lines if line.strip() and not line.lstrip().startswith('#')]
              if azure in urls:
                  if not official.intersection(urls):
                      raise SystemExit('Missing official HTTPS Ubuntu mirror; refusing to change mirrors')
                  mirrors.write_text(''.join(line for line in lines if not line.split() or line.split()[0] != azure))
          PY

      - name: Install seed layout PDF runtime
        if: ${{ matrix.group != 'pol113_pol115_business_entries' && matrix.group != 'contract_finance_acceptance' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer fonts-noto-cjk
          command -v soffice

      - name: Install POL-113/POL-115 browser and document runtimes
        if: ${{ matrix.group == 'pol113_pol115_business_entries' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer libreoffice-calc fonts-noto-cjk
          command -v soffice
          browser_path="$RUNNER_TEMP/pol113-pol115-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_path" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$browser_path" pnpm --filter @jiangkong/web-admin exec playwright install --with-deps chromium webkit
          PLAYWRIGHT_BROWSERS_PATH="$browser_path" pnpm --filter @jiangkong/web-admin exec node scripts/verify-linux-webkit-runtime.cjs

      - name: Install contract finance browser and document runtimes
        if: ${{ matrix.group == 'contract_finance_acceptance' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer libreoffice-calc fonts-noto-cjk
          command -v soffice
          browser_path="$RUNNER_TEMP/contract-finance-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_path" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$browser_path" pnpm --filter @jiangkong/web-admin exec playwright install --with-deps chromium

      - name: Install POL-109 browser runtime
        if: ${{ matrix.group == 'project_close_profit_pol109' }}
        run: |
          browser_path="$RUNNER_TEMP/pol109-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_path" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$browser_path" pnpm --filter @jiangkong/web-admin exec playwright install --with-deps chromium

      - name: Install employee onboarding browser runtime
        if: ${{ matrix.group == 'employee_onboarding' || matrix.group == 'general_procurement' }}
        run: pnpm --filter @jiangkong/web-admin exec playwright install --with-deps chromium webkit

      - name: Verify migration baseline
        run: pnpm check:migration-baseline

      - name: Prepare PostgreSQL 16 dynamic gate image
        run: docker pull postgres:16

      - name: Run exact-SHA PostgreSQL dynamic gate shard
        env:
          DYNAMIC_GROUP: ${{ matrix.group }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          node services/api/prisma/run-database-dynamic-gate-local.cjs \
            --execute \
            --group "$DYNAMIC_GROUP" \
            --candidate-sha "$candidate_sha" \
            --confirm LOCAL_PG16_DYNAMIC_GATE


      - name: Print sanitized timing evidence on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          python3 - <<'PYTRACE'
          import pathlib,json,zipfile
          for file in pathlib.Path('apps/web-admin/test-results').rglob('trace.zip'):
            print('DIAGNOSTIC_TRACE',file.parent.name)
            with zipfile.ZipFile(file) as trace:
              for member in trace.namelist():
                if not member.endswith('.trace'):continue
                calls={}
                for line in trace.read(member).splitlines():
                  event=json.loads(line)
                  if event.get('type')=='before' and event.get('class')=='Test':calls[event['callId']]=event
                  if event.get('type')=='after' and event.get('callId') in calls:
                    start=calls[event['callId']]
                    title=start.get('title','').split(' ',1)[0]
                    print(json.dumps({'action':title,'sourceLine':next((x.get('line') for x in start.get('stack',[]) if x.get('file','').endswith('project-roster-real.e2e.ts')),None),'startedMs':start.get('startTime'),'durationMs':round(event['endTime']-start['startTime'],1),'failed':bool(event.get('error'))}))
          PYTRACE
