name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-manifest-gates:
    name: Static and manifest gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frozen dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jiangkong/api exec prisma generate

      - name: Verify CI orchestration contract
        run: pnpm test:ci-orchestration

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter @jiangkong/web-admin typecheck:e2e

      - name: Lint
        run: pnpm lint

      - name: Verify business error and operations safety gates
        run: |
          node services/api/scripts/check-business-errors.self-test.cjs
          pnpm --filter @jiangkong/api check:business-errors
          bash scripts/ops/go-live-safety-self-test.sh

      - name: Test
        run: pnpm test

      - name: Build Web production application
        run: pnpm --filter @jiangkong/web-admin build

      - name: Verify Web UI governance
        run: pnpm --filter @jiangkong/web-admin check:ui

      - name: Verify capability and usage manifests
        run: pnpm inspect:release-manifests

  postgresql16-dynamic-gate:
    name: PostgreSQL 16 dynamic gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frozen dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jiangkong/api exec prisma generate

      - name: Prepare PostgreSQL 16 dynamic gate image
        run: docker pull postgres:16

      - name: Run exact-SHA PostgreSQL dynamic gate
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          node services/api/prisma/run-database-dynamic-gate-local.cjs \
            --execute \
            --candidate-sha "$candidate_sha" \
            --confirm LOCAL_PG16_DYNAMIC_GATE

  release-gates:
    name: Release gates
    if: ${{ always() }}
    needs: [static-manifest-gates, postgresql16-dynamic-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert all release gates passed
        env:
          STATIC_RESULT: ${{ needs.static-manifest-gates.result }}
          DYNAMIC_RESULT: ${{ needs.postgresql16-dynamic-gate.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$DYNAMIC_RESULT" = success
