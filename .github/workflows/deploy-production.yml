name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the production main ref
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jiangkong/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check business errors
        run: |
          node services/api/scripts/check-business-errors.self-test.cjs
          pnpm --filter @jiangkong/api check:business-errors

      - name: Test
        run: pnpm test

      - name: Build API and Web
        run: |
          pnpm --filter @jiangkong/api build
          pnpm --filter @jiangkong/web-admin build

      - name: Check Web UI governance
        run: pnpm --filter @jiangkong/web-admin check:ui

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Run remote deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          : "${TARGET_SHA:?TARGET_SHA is required}"

          case "$TARGET_SHA" in
            *[!0-9a-f]* | "")
              echo "TARGET_SHA must be a lowercase hexadecimal commit id" >&2
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "TARGET_SHA must contain exactly 40 hexadecimal characters" >&2
            exit 1
          fi

          if [ -z "${DEPLOY_PORT:-}" ]; then
            DEPLOY_PORT=22
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/jiangkong_deploy_key
          chmod 600 ~/.ssh/jiangkong_deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/jiangkong_deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "env TARGET_SHA=$TARGET_SHA bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          assert_clean_release_tree() {
            local entry status_output
            if ! status_output="$(git status --porcelain=v1 --untracked-files=all)"; then
              echo "unable to inspect the production release tree" >&2
              return 1
            fi
            while IFS= read -r entry; do
              case "$entry" in
                "" | "?? .deploy-backups/"* | "?? deploy.sh" | "?? deploy.sh.bak-20260706")
                  ;;
                *)
                  echo "release tree contains a non-allowlisted change: $entry" >&2
                  exit 1
                  ;;
              esac
            done <<< "$status_output"
          }

          git config --global --replace-all safe.directory /opt/jiangkong
          cd /opt/jiangkong
          assert_clean_release_tree
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          git merge --ff-only "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          assert_clean_release_tree
          git rev-parse HEAD

          /opt/jiangkong/scripts/ops/deploy-production-server.sh
          REMOTE_DEPLOY
