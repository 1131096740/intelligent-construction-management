name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "要部署的 origin/main 祖先提交（40 位小写 SHA）"
        required: true
        type: string
      production_confirmation:
        description: "输入 DEPLOY JGZG PRODUCTION 确认生产部署"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deployment request
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail

          if [ "$PRODUCTION_CONFIRMATION" != "DEPLOY JGZG PRODUCTION" ]; then
            echo "Production confirmation must exactly match DEPLOY JGZG PRODUCTION" >&2
            exit 1
          fi

          case "$TARGET_SHA" in
            *[!0-9a-f]* | "")
              echo "target_sha must be a lowercase hexadecimal commit id" >&2
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "target_sha must contain exactly 40 hexadecimal characters" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target commit
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jiangkong/api exec prisma generate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck Web E2E
        run: pnpm --filter @jiangkong/web-admin typecheck:e2e

      - name: Lint
        run: pnpm lint

      - name: Check business errors
        run: |
          node services/api/scripts/check-business-errors.self-test.cjs
          pnpm --filter @jiangkong/api check:business-errors

      - name: Verify backup, restore, and deployment safety gates
        run: bash scripts/ops/go-live-safety-self-test.sh

      - name: Test
        run: pnpm test

      - name: Build API and Web
        run: |
          pnpm --filter @jiangkong/api build
          pnpm --filter @jiangkong/web-admin build

      - name: Check Web UI governance
        run: pnpm --filter @jiangkong/web-admin check:ui

      - name: Install Chromium
        run: pnpm --filter @jiangkong/web-admin exec playwright install --with-deps chromium

      - name: Run Web P0 E2E against production build
        run: pnpm --filter @jiangkong/web-admin exec playwright test --config playwright.config.ts e2e/p0-browser-smoke.e2e.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web-admin/playwright-report/
            apps/web-admin/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    environment: production
    steps:
      - name: Run remote deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          : "${TARGET_SHA:?TARGET_SHA is required}"

          case "$TARGET_SHA" in
            *[!0-9a-f]* | "")
              echo "TARGET_SHA must be a lowercase hexadecimal commit id" >&2
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "TARGET_SHA must contain exactly 40 hexadecimal characters" >&2
            exit 1
          fi

          if [ -z "${DEPLOY_PORT:-}" ]; then
            DEPLOY_PORT=22
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/jiangkong_deploy_key
          chmod 600 ~/.ssh/jiangkong_deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/jiangkong_deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "env TARGET_SHA=$TARGET_SHA bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          assert_clean_release_tree() {
            local entry status_output
            if ! status_output="$(git status --porcelain=v1 --untracked-files=all)"; then
              echo "unable to inspect the production release tree" >&2
              return 1
            fi
            while IFS= read -r entry; do
              case "$entry" in
                "" | "?? .deploy-backups/"* | "?? deploy.sh" | "?? deploy.sh.bak-20260706")
                  ;;
                *)
                  echo "release tree contains a non-allowlisted change: $entry" >&2
                  exit 1
                  ;;
              esac
            done <<< "$status_output"
          }

          git config --global --replace-all safe.directory /opt/jiangkong
          cd /opt/jiangkong
          assert_clean_release_tree
          git fetch origin main
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          git merge --ff-only "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          assert_clean_release_tree
          git rev-parse HEAD

          /opt/jiangkong/scripts/ops/deploy-production-server.sh
          REMOTE_DEPLOY
